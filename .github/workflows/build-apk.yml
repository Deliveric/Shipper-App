name: Build web (APK only on request)
# Every push builds the web version. The Android APK is built only when the
# commit message contains [apk] or the workflow is started manually with apk = true.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apk:
        description: Also build the Android APK
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_APK: ${{ contains(github.event.head_commit.message, '[apk]') || inputs.apk == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        if: env.BUILD_APK == 'true'
        run: flutter create --org com.deliveric --project-name shipper_app --platforms=android .
      - name: Gradle download from services.gradle.org
        if: env.BUILD_APK == 'true'
        run: sed -i -E 's#https\\?://github.com/gradle/gradle-distributions/releases/download/v([0-9.]+)/#https\\://services.gradle.org/distributions/#' android/gradle/wrapper/gradle-wrapper.properties; cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Android permissions and app name
        if: env.BUILD_APK == 'true'
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Shipper Deliveric"#' $M
      - name: minSdk 23 (secure storage)
        if: env.BUILD_APK == 'true'
        run: |
          sed -i -E 's/minSdk(Version)?( |=)+flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true
          sed -i -E 's/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true
      - run: flutter pub get
      - name: Launcher icons
        if: env.BUILD_APK == 'true'
        run: dart run flutter_launcher_icons
      - name: Build release APK
        if: env.BUILD_APK == 'true'
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }}
      - name: Name the output
        if: env.BUILD_APK == 'true'
        run: cp build/app/outputs/flutter-apk/app-release.apk "Shipper Deliveric build ${{ github.run_number }}.apk"
      - name: Verify APK signature
        if: env.BUILD_APK == 'true'
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose "Shipper Deliveric build ${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        if: env.BUILD_APK == 'true'
        with:
          name: Shipper Deliveric build ${{ github.run_number }}
          path: Shipper Deliveric build ${{ github.run_number }}.apk
      - name: Build web version
        run: |
          flutter create --org com.deliveric --project-name shipper_app --platforms=web .
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('assets/image/logo.png').convert('RGBA')
          for path, size in [('web/favicon.png', 32), ('web/icons/Icon-192.png', 192), ('web/icons/Icon-512.png', 512), ('web/icons/Icon-maskable-192.png', 192), ('web/icons/Icon-maskable-512.png', 512)]:
              im.resize((size, size), Image.LANCZOS).save(path)
          PY
          sed -i 's#<title>[^<]*</title>#<title>Shipper Deliveric</title>#' web/index.html
          flutter build web --release --dart-define=BUILD=${{ github.run_number }}
          (cd build/web && zip -qr "../../Shipper Deliveric web build ${{ github.run_number }}.zip" .)
      - name: Publish static site to the "web" branch (for Render Static Site)
        run: |
          cd build/web
          cat > render.yaml <<'Y'
          services:
            - type: web
              name: shipper-deliveric
              runtime: static
              staticPublishPath: .
              routes:
                - type: rewrite
                  source: /api_v2/*
                  destination: https://deliveric.net/api_v2/*
                - type: rewrite
                  source: /admin-area/*
                  destination: https://deliveric.net/admin-area/*
                - type: rewrite
                  source: /*
                  destination: /index.html
          Y
          sed -i 's/^          //' render.yaml
          git init -q -b web
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Web build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web
      - uses: actions/upload-artifact@v4
        with:
          name: Shipper Deliveric web build ${{ github.run_number }}
          path: Shipper Deliveric web build ${{ github.run_number }}.zip
      - name: Publish release (direct .apk download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=("Shipper Deliveric web build ${{ github.run_number }}.zip")
          NOTE="Web build only. The web branch holds the static site for Render."
          if [ "$BUILD_APK" = "true" ]; then
            FILES+=("Shipper Deliveric build ${{ github.run_number }}.apk")
            NOTE="APK for Android + web build. The web branch holds the static site for Render."
          fi
          gh release create "build-${{ github.run_number }}" "${FILES[@]}" \
            --title "Shipper Deliveric build ${{ github.run_number }}" --notes "$NOTE"
