name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --org com.deliveric --project-name shipper_app --platforms=android .
      - name: Android permissions and app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Shipper Deliveric"#' $M
      - run: flutter pub get
      - name: Launcher icons
        run: dart run flutter_launcher_icons
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Name the output
        run: cp build/app/outputs/flutter-apk/app-release.apk "Shipper Deliveric build ${{ github.run_number }}.apk"
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose "Shipper Deliveric build ${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Shipper Deliveric build ${{ github.run_number }}
          path: Shipper Deliveric build ${{ github.run_number }}.apk
      - name: Publish release (direct .apk download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "Shipper Deliveric build ${{ github.run_number }}.apk" \
            --title "Shipper Deliveric build ${{ github.run_number }}" --notes "Install the .apk directly."
